header:
  version: 23

machine:  iot2000

repos:
  meta-iot2000:
    layers:
      meta-iot2000-bsp:

  bitbake:
    url: https://git.openembedded.org/bitbake/
    commit: acfe02fa38b5da9e6a36c6cedcf91d4fcbefbfbd
    layers: {}

  openembedded-core:
    url: https://git.openembedded.org/openembedded-core/
    commit: 5d1aa5c806c061a2994f4decb59016610f093213
    layers:
      meta:

  meta-yocto:
    url: https://git.yoctoproject.org/meta-yocto
    commit: 24c24cef5d1523fefe43a3e3d34667b37ae551f3
    layers:
      meta-poky:
      meta-yocto-bsp:

  meta-efibootguard:
    url: https://github.com/siemens/meta-efibootguard
    commit: 228d33a30947232bd00e15c0fb6b5c209ef186f9

  meta-openembedded:
    url: https://git.openembedded.org/meta-openembedded
    branch: wrynose
    layers:
      meta-oe:

bblayers_conf_header:
  standard: |
    POKY_BBLAYERS_CONF_VERSION = "2"
    BBPATH = "${TOPDIR}"
    BBFILES ?= ""

local_conf_header:
  standard: |
    CONF_VERSION = "2"

  buildstats:
    INHERIT += "buildstats"

  debug-tweaks: |
    EXTRA_IMAGE_FEATURES ?= "debug-tweaks"

  diskmon: |
    BB_DISKMON_DIRS = "\
        STOPTASKS,${TMPDIR},1G,100K \
        STOPTASKS,${DL_DIR},1G,100K \
        STOPTASKS,${SSTATE_DIR},1G,100K \
        STOPTASKS,/tmp,100M,100K \
        ABORT,${TMPDIR},100M,1K \
        ABORT,${DL_DIR},100M,1K \
        ABORT,${SSTATE_DIR},100M,1K \
        ABORT,/tmp,10M,1K"
