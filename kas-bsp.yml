header:
  version: 2

machine:  iot2000

repos:
  meta-iot2000:
    layers:
      meta-iot2000-bsp:

  poky:
    url: https://git.yoctoproject.org/git/poky
    refspec: 077627338ac18aeca34bfe0c52777fab38e2e0c0
    layers:
      meta:
      meta-poky:
      meta-yocto-bsp:

  meta-efibootguard:
    url: https://github.com/siemens/meta-efibootguard
    refspec: 9917279c26994c0f21a8ebcd61e7dcacc6d9c207

  meta-openembedded:
    url: https://git.openembedded.org/meta-openembedded
    refspec: ef3df29f2cfca6a9513b51ebcdccf82b6c8a836f
    layers:
      meta-oe:

bblayers_conf_header:
  standard: |
    POKY_BBLAYERS_CONF_VERSION = "2"
    BBPATH = "${TOPDIR}"
    BBFILES ?= ""

local_conf_header:
  standard: |
    CONF_VERSION = "2"

  buildstats:
    INHERIT += "buildstats"

  debug-tweaks: |
    EXTRA_IMAGE_FEATURES ?= "debug-tweaks"

  diskmon: |
    BB_DISKMON_DIRS = "\
        STOPTASKS,${TMPDIR},1G,100K \
        STOPTASKS,${DL_DIR},1G,100K \
        STOPTASKS,${SSTATE_DIR},1G,100K \
        STOPTASKS,/tmp,100M,100K \
        ABORT,${TMPDIR},100M,1K \
        ABORT,${DL_DIR},100M,1K \
        ABORT,${SSTATE_DIR},100M,1K \
        ABORT,/tmp,10M,1K"
